<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Grocery Order</title>
</head>
<body>

<h2 style="text-align:center; font-family:Arial, sans-serif;">Online Grocery Order</h2>

<form action="order.php" method="post">

    
    <fieldset>
        <legend><strong>Customer Details</strong></legend>

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required autofocus><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required><br><br>

        <label for="address">Delivery Address:</label><br>
        <textarea id="address" name="address" rows="3" cols="40" placeholder="Enter delivery address" required></textarea>
    </fieldset>
    <br>

    <fieldset>
        <legend><strong>Order Details</strong></legend>

        <label>Grocery Items:</label><br>
        <input type="checkbox" name="items[]" value="Rice"> Rice
        <input type="checkbox" name="items[]" value="Milk"> Milk
        <input type="checkbox" name="items[]" value="Bread"> Bread
        <input type="checkbox" name="items[]" value="Eggs"> Eggs
        <input type="checkbox" name="items[]" value="Sugar"> Sugar
        <br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" min="1" max="10" required><br><br>

        <label for="delivery_date">Delivery Date:</label><br>
        <input type="date" id="delivery_date" name="delivery_date" required><br><br>

        <label for="delivery_time">Preferred Delivery Time:</label><br>
        <input type="time" id="delivery_time" name="delivery_time"><br><br>

        <label>Payment Method:</label><br>
        <input type="radio" name="payment" value="Cash on Delivery" required> Cash on Delivery
        <input type="radio" name="payment" value="UPI"> UPI
        <input type="radio" name="payment" value="Card"> Card
        <br><br>

        <label for="instructions">Special Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="3" cols="40" placeholder="Optional"></textarea>
    </fieldset>
    <br>

    <input type="checkbox" name="confirm" value="yes" required> I confirm my order
    <br><br>

    <input type="submit" value="Submit Order">
    <input type="reset" value="Reset Form">

</form>

</body>
</html>
