<!DOCTYPE html>
<html>
<head>
  <title>Book Store Management</title>
  <meta charset="UTF-8">
</head>
<body>
<script>
  let books = [
    { title: "JavaScript Basics", author: "Anu", price: 450, available: true },
    { title: "HTML & CSS", author: "Devi", price: 350, available: false }
  ];

  document.write("All Books:<br>");
  for (let book of books) {
    document.write(`Title: ${book.title}, Author: ${book.author}, Price: ${book.price} ₹, Available: ${book.available}<br>`);
  }

  document.write("<br>Available Books:<br>");
  for (let book of books) {
    if (book.available) {
      document.write(`Title: ${book.title}, Author: ${book.author}, Price: ${book.price} ₹<br>`);
    }
  }

  books.push({ title: "Node.js Guide", author: "Ravi", price: 600, available: true });
  document.write("<br>After Adding: " + books.map(b => b.title).join(", ") + "<br>");

  for (let book of books) {
    if (book.title === "JavaScript Basics") {
      book.price = 500;
    }
  }
  document.write("After Price Update: " + books.map(b => `${b.title} - ${b.price} ₹`).join(", ") + "<br>");

  books = books.filter(b => b.title !== "JavaScript Basics");
  document.write("After Deletion: " + books.map(b => b.title).join(", "));
</script>
</body>
</html>
