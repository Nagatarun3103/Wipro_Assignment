<!DOCTYPE html>
<html>
<head>
  <title>Tour Booking Form</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      padding: 5px;
      margin-top: 5px;
      width: 200px;
    }
    button {
      margin-top: 15px;
      padding: 8px 16px;
      font-size: 16px;
    }
    #summary {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #333;
      max-width: 400px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Tour Booking Form</h2>
  <form id="bookingForm" onsubmit="calculateTotal(event)">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" required />

    <label for="email">Email:</label>
    <input type="email" id="email" required />

    <label for="destination">Destination:</label>
    <select id="destination" required>
      <option value="">-- Select Destination --</option>
      <option value="Ooty">Ooty</option>
      <option value="Goa">Goa</option>
      <option value="Manali">Manali</option>
    </select>

    <label for="days">Number of Days:</label>
    <input type="number" id="days" min="1" required />

    <label for="travelers">Number of Travelers:</label>
    <input type="number" id="travelers" min="1" required />

    <button type="submit">Book Now</button>
  </form>

  <div id="summary"></div>

  <script>
    function calculateTotal(event) {
      event.preventDefault();

      let name = document.getElementById('fullName').value.trim();
      let email = document.getElementById('email').value.trim();
      let destination = document.getElementById('destination').value;
      let days = parseInt(document.getElementById('days').value);
      let travelers = parseInt(document.getElementById('travelers').value);

      if (!name || !email || !destination || isNaN(days) || isNaN(travelers) || days <= 0 || travelers <= 0) {
        alert("Please fill in all fields correctly.");
        return;
      }

      let pricePerDayPerPerson = 0;
      switch (destination) {
        case "Ooty":
          pricePerDayPerPerson = 2000;
          break;
        case "Goa":
          pricePerDayPerPerson = 3000;
          break;
        case "Manali":
          pricePerDayPerPerson = 4000;
          break;
      }

      let totalPrice = pricePerDayPerPerson * days * travelers;

      let summaryDiv = document.getElementById('summary');
      summaryDiv.innerHTML = 
        `<h3>Booking Summary</h3>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>Email:</strong> ${email}</p>
        <p><strong>Destination:</strong> ${destination}</p>
        <p><strong>Days:</strong> ${days}</p>
        <p><strong>Travelers:</strong> ${travelers}</p>
        <p><strong>Total Price:</strong> ₹${totalPrice.toLocaleString()}</p>`;
    }
  </script>
</body>
</html>
